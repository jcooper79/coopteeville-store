    <path d="M34 70 Q38 20 70 20 Q102 20 106 70 Z" fill="#ff4b3e" stroke="#9e1f16" stroke-width="4"/>
    <path d="M44 68 Q48 34 70 33 Q92 34 96 68 Z" fill="#bfe6ff" stroke="#9e1f16" stroke-width="3"/>
    <path d="M64 20 H76 V110 H64 Z" fill="#fff" opacity=".9"/>
    <circle cx="44" cy="88" r="15" fill="#fff" stroke="#9e1f16" stroke-width="4"/><circle cx="47" cy="90" r="6.5" fill="#1c2033"/><circle cx="49" cy="87" r="2" fill="#fff"/>
    <circle cx="96" cy="88" r="15" fill="#fff" stroke="#9e1f16" stroke-width="4"/><circle cx="99" cy="90" r="6.5" fill="#1c2033"/><circle cx="101" cy="87" r="2" fill="#fff"/>
    <path d="M28 66 Q44 58 60 66 M80 66 Q96 58 112 66" stroke="#1c2033" stroke-width="5" stroke-linecap="round" fill="none"/>
