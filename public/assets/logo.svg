<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Coopteeville logo">
  <!-- Town-sign wordmark. Outline the text before sending to print vendors. -->
  <defs>
    <style>.d{font-family:Bungee,'Arial Black',sans-serif}.b{font-family:'Baloo 2',sans-serif;font-weight:800}</style>
  </defs>
  <rect x="40" y="110" width="20" height="180" rx="6" fill="#1c2033"/>
  <rect x="580" y="110" width="20" height="180" rx="6" fill="#1c2033"/>
  <rect x="10" y="96" width="620" height="150" rx="34" fill="#1c2033"/>
  <rect x="20" y="104" width="600" height="132" rx="28" fill="#ffc83a"/>
  <text x="320" y="138" text-anchor="middle" class="b" font-size="20" letter-spacing="6" fill="#1c2033">WELCOME TO</text>
  <text x="320" y="198" text-anchor="middle" class="d" font-size="58" fill="#1c2033">COOPTEE<tspan fill="#ff4b3e">VILLE</tspan></text>
  <text x="320" y="226" text-anchor="middle" class="b" font-size="16" letter-spacing="4" fill="#1c2033">EST. 2026 · POP. HILARIOUS</text>
